<!DOCTYPE html>
<html>
<head>
<title>Delete Result</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
font-family:Arial;
padding:40px;
background:#f4f7f6;
}

.container{
max-width:500px;
margin:auto;
background:white;
padding:30px;
border-radius:15px;
box-shadow:0 5px 20px rgba(0,0,0,.1);
}

input{
width:100%;
padding:12px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:red;
color:white;
border:none;
cursor:pointer;
}
</style>

</head>
<body>

<div class="container">

<h2>Delete Result</h2>

<input
type="number"
id="resultId"
placeholder="Enter Result ID">

<button onclick="deleteResult()">
Delete Result
</button>

</div>

<script>

async function deleteResult(){

const resultId =
document.getElementById("resultId").value.trim();

if(!resultId){
alert("Enter Result ID");
return;
}

const response = await fetch(
"/api/admin/results/" + resultId,
{
method:"DELETE",
headers:{
"x-admin-key":"RSIMT-ADMIN-2026"
}
});

const data = await response.json();

alert(data.message);

}

</script>

</body>
</html>
