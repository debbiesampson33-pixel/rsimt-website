<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard | RSIMT</title><link rel="stylesheet" href="style.css"><style>.student-dashboard{max-width:1000px;margin:auto;padding:50px 6%}.student-welcome,.student-panel{background:#fff;border-radius:18px;padding:30px;box-shadow:0 12px 35px rgba(0,0,0,.07);margin-bottom:24px}.student-welcome h1{color:#087f3f}.student-meta{color:#666}.student-actions{display:flex;gap:12px;flex-wrap:wrap}.student-actions button{padding:12px 18px;border:0;border-radius:7px;background:#087f3f;color:#fff;cursor:pointer;font-weight:700}.results-table{width:100%;border-collapse:collapse}.results-table th,.results-table td{padding:12px;border-bottom:1px solid #eee;text-align:left}@media(max-width:600px){.student-dashboard{padding:35px 5%}.student-welcome,.student-panel{padding:22px}.results-table{font-size:13px}}</style></head><body class="portal-page"><header class="portal-header"><a href="rsimt.html" class="portal-logo">RSIMT</a><a href="rsimt.html" class="portal-back">← Back to RSIMT</a></header><main class="student-dashboard"><section class="student-welcome"><span>RSIMT STUDENT PORTAL</span><h1 id="studentName">Student</h1><p class="student-meta">Student ID: <strong id="studentId"></strong></p><p class="student-meta" id="studentEmail"></p><div class="student-actions"><button id="refresh">Refresh Results</button><button id="logout">Logout</button></div></section><section class="student-panel">
    <h2>Result Checker</h2>
    <p>Check and view your academic results below.</p>
    <div id="results">Loading...</div>
</section></main><script>
const s=JSON.parse(sessionStorage.getItem("rsimtStudent")||"null");if(!s)location.href="student-portal.html";else{studentName.textContent=s.fullName;studentId.textContent=s.studentId;studentEmail.textContent=s.email||"";async function load(){const r=await fetch("/api/student/"+encodeURIComponent(s.studentId)+"/results"),a=await r.json();if(!a.length){results.textContent="No results available yet.";return}results.innerHTML="<table class='results-table'><tr><th>Session</th><th>Semester</th><th>Course</th><th>Score</th><th>Grade</th></tr>"+a.map(x=>"<tr><td>"+x.session+"</td><td>"+x.semester+"</td><td>"+x.course+"</td><td>"+x.score+"</td><td>"+x.grade+"</td></tr>").join("")+"</table>"}load();refresh.onclick=load;logout.onclick=()=>{sessionStorage.removeItem("rsimtStudent");location.href="student-portal.html"}}</script></body></html>
